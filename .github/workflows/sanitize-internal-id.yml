name: sanitize-internal-id

on:
  push:
    paths:
      - '.github/workflows/sanitize-internal-id.yml'

permissions:
  contents: write

jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove internal project identifier from current repository contents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          self_path = Path('.github/workflows/sanitize-internal-id.yml')
          replacements = [
              ('PAPER003_V31_RETURN_PACKAGE.zip', 'EGFR_QSAR_STRENGTHENING_RETURN.zip'),
              ('PAPER003_V3_RETURN_PACKAGE.zip', 'EGFR_QSAR_REPRODUCIBILITY_RETURN.zip'),
              ('MASTER_RUN_PAPER003_V3.cmd', 'RUN_EGFR_QSAR_REPRODUCIBILITY.cmd'),
              ('SMOKE_TEST_PAPER003_V3.cmd', 'SMOKE_TEST_EGFR_QSAR_REPRODUCIBILITY.cmd'),
              ('.paper003_requirements_hash.txt', '.egfr_qsar_requirements_hash.txt'),
              ('paper003-egfr-qsar', 'egfr-graph-qsar'),
              ('PAPER003 · REPRODUCIBLE CHEMINFORMATICS', 'REPRODUCIBLE CHEMINFORMATICS'),
              ('PAPER003 frozen study workflow', 'Frozen EGFR QSAR study workflow'),
              ('Frozen PAPER003 workflow', 'Frozen EGFR QSAR workflow'),
              ('associated PAPER003 manuscript/article', 'associated manuscript/article'),
              ('associated PAPER003 article', 'associated article'),
              ('Original PAPER003 project code', 'Original project code'),
              ('historical PAPER003 archive', 'historical study archive'),
              ('submission-aligned numerical evidence for PAPER003', 'submission-aligned numerical evidence for this study'),
              ('PAPER003', 'EGFR Graph QSAR'),
              ('paper003', 'egfr_graph_qsar'),
              ('Paper003', 'EGFR Graph QSAR'),
          ]

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == self_path:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              new = text
              for old, repl in replacements:
                  new = new.replace(old, repl)
              if new != text:
                  path.write_text(new, encoding='utf-8')

          renames = {
              Path('MASTER_RUN_PAPER003_V3.cmd'): Path('RUN_EGFR_QSAR_REPRODUCIBILITY.cmd'),
              Path('SMOKE_TEST_PAPER003_V3.cmd'): Path('SMOKE_TEST_EGFR_QSAR_REPRODUCIBILITY.cmd'),
          }
          for src, dst in renames.items():
              if src.exists():
                  src.rename(dst)
          PY

          if grep -Rni --exclude-dir=.git --exclude='sanitize-internal-id.yml' -E 'PAPER003|paper003|Paper003' .; then
            echo 'Internal identifier still present outside the temporary sanitizer.' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows/sanitize-internal-id.yml'
          if git diff --cached --quiet; then
            echo 'No repository-content changes required.'
          else
            git commit -m 'Remove internal project identifier from public repository'
            git push origin HEAD:main
          fi
