name: lightweight-qa

on:
  push:
  pull_request:

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate frozen public package
        run: python scripts/validate_frozen_package.py
      - name: Compile available Python sources
        run: |
          python -m compileall -q v31 scripts
