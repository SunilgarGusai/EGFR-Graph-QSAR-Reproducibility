name: lightweight-qa

on:
  push:
  pull_request:

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject internal project identifiers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = ''.join(['PAPER', '003']).lower()
          hits = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.as_posix() == '.github/workflows/qa.yml':
                  continue
              try:
                  text = path.read_text(encoding='utf-8').lower()
              except (UnicodeDecodeError, OSError):
                  continue
              if forbidden in text or forbidden in path.as_posix().lower():
                  hits.append(str(path))
          if hits:
              raise SystemExit('Internal project identifier found in public repository: ' + ', '.join(hits))
          print('No internal project identifiers found.')
          PY
      - name: Validate frozen public package
        run: python scripts/validate_frozen_package.py
      - name: Compile available Python sources
        run: |
          python -m compileall -q v31 scripts
