<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Frozen EGFR QSAR study workflow</title>
  <desc id="desc">Frozen EGFR cohort is represented by Graph19, RDKit2D, and ECFP4, then evaluated under random and scaffold splits, representation ambiguity, chemical-space diagnostics, and uncertainty analysis.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2e5266"/></marker><style>.box{fill:#ffffff;stroke:#244b5f;stroke-width:2.2}.title{font:700 24px 'Segoe UI',Arial,sans-serif;fill:#102f40}.txt{font:18px 'Segoe UI',Arial,sans-serif;fill:#294b5a}.small{font:16px 'Segoe UI',Arial,sans-serif;fill:#365a68}.head{font:800 30px 'Segoe UI',Arial,sans-serif;fill:#0e3447}.arrow{stroke:#2e5266;stroke-width:2.6;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1400" height="620" rx="24" fill="#f6fbfc"/><text x="700" y="54" text-anchor="middle" class="head">Frozen EGFR representation benchmark and diagnosis</text>
  <rect x="55" y="105" width="280" height="180" rx="22" class="box"/><text x="195" y="146" text-anchor="middle" class="title">1 · Frozen data</text><text x="195" y="184" text-anchor="middle" class="txt">17,705 source records</text><text x="195" y="216" text-anchor="middle" class="txt">17,412 curated records</text><text x="195" y="248" text-anchor="middle" class="txt">10,056 unique molecules</text>
  <rect x="400" y="105" width="300" height="180" rx="22" class="box"/><text x="550" y="146" text-anchor="middle" class="title">2 · Representations</text><text x="550" y="184" text-anchor="middle" class="txt">Graph19 · 19 features</text><text x="550" y="216" text-anchor="middle" class="txt">RDKit2D · 196 features</text><text x="550" y="248" text-anchor="middle" class="txt">ECFP4 · 2,048 bits</text>
  <rect x="765" y="105" width="280" height="180" rx="22" class="box"/><text x="905" y="146" text-anchor="middle" class="title">3 · Validation</text><text x="905" y="184" text-anchor="middle" class="txt">5 random splits</text><text x="905" y="216" text-anchor="middle" class="txt">5 Murcko scaffold folds</text><text x="905" y="248" text-anchor="middle" class="txt">Matched RF principles</text>
  <rect x="1110" y="105" width="235" height="180" rx="22" class="box"/><text x="1228" y="146" text-anchor="middle" class="title">4 · Reliability</text><text x="1228" y="184" text-anchor="middle" class="small">Chemical similarity</text><text x="1228" y="216" text-anchor="middle" class="small">Conformal intervals</text><text x="1228" y="248" text-anchor="middle" class="small">Williams leverage</text>
  <path d="M335 195 H395" class="arrow"/><path d="M700 195 H760" class="arrow"/><path d="M1045 195 H1105" class="arrow"/>
  <rect x="170" y="365" width="310" height="175" rx="22" class="box"/><text x="325" y="406" text-anchor="middle" class="title">5 · Representation limits</text><text x="325" y="444" text-anchor="middle" class="txt">1,507 exact collision groups</text><text x="325" y="476" text-anchor="middle" class="txt">4,181 molecules · 41.6%</text><text x="325" y="508" text-anchor="middle" class="small">108 discordant low-similarity pairs</text>
  <rect x="545" y="365" width="310" height="175" rx="22" class="box"/><text x="700" y="406" text-anchor="middle" class="title">6 · Interpretation</text><text x="700" y="444" text-anchor="middle" class="txt">Descriptor-family ablation</text><text x="700" y="476" text-anchor="middle" class="txt">Held-out permutation</text><text x="700" y="508" text-anchor="middle" class="small">Distance topology dominates Graph19</text>
  <rect x="920" y="365" width="310" height="175" rx="22" class="box"/><text x="1075" y="406" text-anchor="middle" class="title">7 · Robustness</text><text x="1075" y="444" text-anchor="middle" class="txt">Paired effect sizes</text><text x="1075" y="476" text-anchor="middle" class="txt">RF sampling sensitivity</text><text x="1075" y="508" text-anchor="middle" class="small">ECFP4 &gt; RDKit2D &gt; Graph19 persists</text>
  <path d="M545 452 H485" class="arrow"/><path d="M855 452 H915" class="arrow"/><path d="M550 285 C550 325 325 325 325 360" class="arrow"/><path d="M905 285 C905 330 1075 330 1075 360" class="arrow"/>
</svg>